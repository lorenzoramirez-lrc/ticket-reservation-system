services:
  postgres:
    image: postgres:17
    container_name: ticket-reservation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: event-reservation 
      POSTGRES_USER: root 
      POSTGRES_PASSWORD: root 
      REPLICATION_PASSWORD: root
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./replication/primary-init.sh:/docker-entrypoint-initdb.d/02-primary-init.sh:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - max_replication_slots=5
      - -c
      - wal_keep_size=128MB
      - -c
      - max_slot_wal_keep_size=1GB
      - -c
      - password_encryption=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d event-reservation"]
      interval: 5s
      timeout: 5s
      retries: 12
  postgres-replica:
    image: postgres:17
    container_name: ticket-reservation-postgres-replica
    restart: unless-stopped
    user: postgres 
    environment:
      PGDATA: /var/lib/postgresql/data
      REPLICATION_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./replication/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    entrypoint: ["bash", "/usr/local/bin/replica-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d event-reservation && test -f \"$${PGDATA}/standby.signal\""]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: reservations-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: lider
  postgres_replica_data:
