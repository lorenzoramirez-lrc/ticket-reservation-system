services:
  postgres:
    image: postgres:17
    container_name: ticket-reservation-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: event-reservation 
      POSTGRES_USER: root 
      POSTGRES_PASSWORD: root 

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: reservations-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.local
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      - postgres



volumes:
  postgres_data:
